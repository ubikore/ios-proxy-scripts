# Hupu splash ad mock for Quantumult X
# Version: 1.0.0
# Updated: 2026-11-09
# Immediately returns an empty ad response instead of rejecting the request.
# Install as a remote rewrite resource; enable MitM and trust its certificate.
# Disable overlapping Hupu splash ad reject/rewrite rules.

hostname = goblin.hupu.com

^https?:\/\/goblin\.hupu\.com\/\d+\/[\d.]+\/interfaceAd\/getOther url script-echo-response https://raw.githubusercontent.com/ubikore/ios-proxy-scripts/main/scripts/hupu-splash-adblock.js
